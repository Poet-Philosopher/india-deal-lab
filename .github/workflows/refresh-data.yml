name: Refresh data snapshots

# Weekly: pull fresh financials for every preset company and commit them to data/snapshots/.
# The app falls back to these files whenever Yahoo Finance is slow or unavailable.
# The bot commit also counts as repository activity, which keeps scheduled workflows enabled.

on:
  schedule:
    - cron: "30 2 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Refresh snapshots
        run: python scripts/refresh_snapshots.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots
          if git diff --cached --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "chore: refresh data snapshots"
            git push
          fi
