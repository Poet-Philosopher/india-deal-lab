name: Keep Streamlit app awake

# Streamlit Community Cloud sleeps idle apps. This visits the app in a real headless
# browser every 6 hours and clicks "Yes, get this app back up!" if it is asleep.
#
# Setup: repo Settings > Secrets and variables > Actions > Variables > New repository variable
#        Name: APP_URL   Value: https://<your-app>.streamlit.app

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wake:
    if: ${{ vars.APP_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        run: |
          python -m pip install --upgrade pip playwright
          python -m playwright install --with-deps chromium
      - name: Wake the app and confirm it renders
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: python scripts/keepalive.py
